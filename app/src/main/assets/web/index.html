<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Castla</title>
    <link rel="stylesheet" href="css/player.css">
    <style>
        /* Web Native Launcher Styles */
        #web-launcher {
            display: none !important; /* Unified sidebar launcher is now the primary launcher! Completely hidden. */
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #0F0F1A;
            z-index: 200; /* Above the video player */
            overflow-y: auto;
            flex-direction: column;
            padding: 30px;
            color: #fff;
            font-family: sans-serif;
            transition: opacity 0.3s ease;
        }

        #web-launcher.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        #launcher-loading {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 28px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 999999;
            pointer-events: none;
            gap: 12px;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: #ffffff;
            font-family: sans-serif;
            font-weight: 500;
            white-space: nowrap;
        }

        .category-section {
            margin-bottom: 24px;
        }

        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .category-bar {
            width: 6px;
            height: 24px;
            border-radius: 3px;
            margin-right: 12px;
        }

        .category-title {
            font-size: 20px;
            font-weight: bold;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
        }

        .app-cell {
            position: relative; /* 별표 위치 기준점 고정 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            padding: 12px 8px;
            border-radius: 12px;
            transition: background 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .app-cell:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .app-icon-wrapper {
            position: relative; /* 별표와 번개 위치 기준점 */
            width: 72px;
            height: 72px;
            margin-bottom: 8px;
        }

        .app-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .app-cell:active .app-icon {
            transform: scale(0.95);
        }

        .app-label {
            font-size: 13px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            color: #ddd;
        }

        /* ── 즐겨찾기(Favorites) 별표 및 자동 실행(Auto-run) 번개 스타일 ── */
        .app-star {
            position: absolute;
            top: -6px;
            right: -8px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.35);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
            transition: color 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.15s ease;
            z-index: 15;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-star:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: scale(1.2);
        }

        .app-star.active {
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        .app-star.active:active {
            transform: scale(1.35);
        }

        .app-bolt {
            position: absolute;
            top: -6px;
            left: -8px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.35);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
            transition: color 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.15s ease;
            z-index: 15;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-bolt:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: scale(1.2);
        }

        .app-bolt.active.primary {
            color: #00E5FF;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        .app-bolt.active.secondary {
            color: #E040FB;
            text-shadow: 0 0 8px rgba(224, 64, 251, 0.6);
        }

        .app-bolt.active:active {
            transform: scale(1.35);
        }

        /* ── Split Launcher Drawer (Dual App) ── */
        #split-drawer {
            position: absolute;
            top: 0; bottom: 0; right: -300px;
            width: 300px;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            z-index: 600; /* Raised higher than dragOverlay (500) to allow unobstructed dragging & app pairing */
            transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            display: flex; /* keep as flex always, controlled by right slide */
            flex-direction: column;
            color: white;
            font-family: sans-serif;
        }
        #split-drawer.open {
            right: 0;
        }

        #split-handle {
            position: absolute;
            left: -28px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 80px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 14px 0 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: -2px 0 8px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-right: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .handle-dots {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-right: 2px;
        }

        .handle-dot {
            width: 4px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        .split-drawer-header {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }
        .close-drawer {
            cursor: pointer;
            font-size: 20px;
        }
        .split-app-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .split-app-item {
            position: relative; /* 별표 위치 기준점 고정 */
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
        }
        .split-app-item:hover {
            background: rgba(255,255,255,0.15);
        }
        .split-app-star {
            position: absolute;
            top: 50%;
            right: 12px;
            left: auto;
            transform: translateY(-50%);
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .split-app-star:hover {
            transform: translateY(-50%) scale(1.2);
        }
        .split-app-star.active {
            transform: translateY(-50%) scale(1.0);
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 1px 2px rgba(0, 0, 0, 0.9);
        }
        .split-app-bolt {
            position: absolute;
            top: 50%;
            right: 38px;
            left: auto;
            transform: translateY(-50%);
            font-size: 20px;
            color: rgba(255, 255, 255, 0.22);
            transition: color 0.2s ease, transform 0.15s ease;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .split-app-bolt:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: translateY(-50%) scale(1.2);
        }
        .split-app-bolt.active.primary {
            color: #00E5FF;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
            transform: translateY(-50%) scale(1.0);
        }
        .split-app-bolt.active.secondary {
            color: #E040FB;
            text-shadow: 0 0 8px rgba(224, 64, 251, 0.6);
            transform: translateY(-50%) scale(1.0);
        }
        .split-app-icon {
            width: 40px; height: 40px;
            margin-right: 12px;
            object-fit: contain;
        }
        .split-category-section {
            margin-bottom: 16px;
        }
        .split-category-header {
            display: flex;
            align-items: center;
            padding: 4px 4px 8px 4px;
        }
        .split-category-bar {
            width: 4px;
            height: 18px;
            border-radius: 2px;
            margin-right: 10px;
        }
        .split-category-title {
            font-size: 15px;
            font-weight: bold;
            color: #ddd;
        }
        .split-category-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ── Bubble Composer ── */
        #input-bubble {
            position: fixed;
            z-index: 9999;
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 20px;
            background: rgba(30, 30, 40, 0.95);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 90vw;
        }
        #input-bubble.visible {
            display: flex !important;
        }
        #input-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(30, 30, 40, 0.92);
        }
        #bubble-text {
            flex: 1;
            min-width: 160px;
            max-width: 50vw;
            height: 36px;
            padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 16px;
            outline: none;
            caret-color: #64B5F6;
        }
        #bubble-text::placeholder { color: rgba(255,255,255,0.35); }
        #bubble-text:focus { border-color: #64B5F6; }
        .bubble-btn {
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        #bubble-submit {
            background: #64B5F6;
            color: #111;
        }
        #bubble-submit:active { background: #42A5F5; }
        #bubble-cancel {
            background: rgba(255,255,255,0.12);
            color: #ccc;
        }
        #bubble-cancel:active { background: rgba(255,255,255,0.2); }
        #bubble-backspace {
            background: rgba(255,80,80,0.2);
            color: #ff8080;
            padding: 0 12px;
            font-size: 18px;
        }
        #bubble-backspace:active { background: rgba(255,80,80,0.35); }

        #splash-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #0a0a12;
            z-index: 1000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        #splash-screen.hidden {
            opacity: 0; pointer-events: none;
        }
        #splash-screen.removed {
            display: none !important;
        }
        #splash-logo {
            width: 80px;
            height: auto;
            margin-bottom: 40px;
            opacity: 0.85;
        }
        #splash-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #splash-loading.hidden {
            opacity: 0; pointer-events: none;
        }
        .splash-spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .splash-loading-text {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.5px;
        }
        #splash-unmute {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #splash-unmute.visible {
            display: flex;
            opacity: 1;
        }
        .splash-tap-text {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 28px;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #player-shell {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            --split-left-width: 42%;
        }
        #stream-pane {
            position: relative;
            width: 100%;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        #player-shell.browser-split #stream-pane {
            width: var(--split-left-width);
        }
        #browser-split-pane {
            position: relative;
            display: none;
            width: calc(100% - var(--split-left-width));
            min-width: 280px;
            height: 100%;
            background: #05070d;
            border-left: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }
        #player-shell.browser-split #browser-split-pane {
            display: block;
        }
        #display,
        #mse-video,
        #display-secondary {
            width: 100%;
            height: 100%;
            display: block;
        }
        #display-secondary {
            background: #111;
        }
        #player-shell.browser-split #display-secondary {
            display: block;
        }

        /* Secondary Fullscreen Mode: Hide primary and stretch secondary to 100% */
        #player-shell.secondary-fullscreen #stream-pane {
            display: none !important;
            width: 0 !important;
        }
        #player-shell.secondary-fullscreen #browser-split-pane {
            display: block !important;
            width: 100% !important;
            border-left: none !important;
        }
        #player-shell.secondary-fullscreen #split-divider {
            display: none !important;
        }

        /* Swapped split screen layout: flex-direction row-reverse and reverse border */
        #player-shell.swapped {
            flex-direction: row-reverse;
        }
        #player-shell.swapped #browser-split-pane {
            border-left: none;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }
        #player-shell.swapped.secondary-fullscreen #browser-split-pane {
            border-right: none !important;
        }

        /* ── Browser-Only Split Pane ── */
        .browser-pane-ui {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #0a0c14;
        }
        .browser-pane-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(20, 22, 35, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .browser-url-input {
            flex: 1;
            height: 34px;
            padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        .browser-url-input:focus { border-color: #64B5F6; }
        .browser-url-input::placeholder { color: rgba(255,255,255,0.3); }
        .browser-toolbar-btn {
            height: 34px;
            padding: 0 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .browser-toolbar-btn:active { background: rgba(255,255,255,0.2); }
        .browser-toolbar-btn.go-btn { background: #64B5F6; color: #111; font-weight: 600; }
        .browser-toolbar-btn.go-btn:active { background: #42A5F5; }
        .browser-presets {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .browser-preset-btn {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: #ddd;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .browser-preset-btn:hover { background: rgba(255,255,255,0.12); }
        .browser-preset-btn.active { background: rgba(100,181,246,0.2); border-color: #64B5F6; color: #64B5F6; }
        .browser-iframe-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        .browser-iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .browser-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10,12,20,0.9);
            z-index: 2;
        }
        .browser-loading.hidden { display: none; }
        .browser-error {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 3;
            text-align: center;
            padding: 20px;
        }
        .browser-error.visible { display: flex; }
        .browser-home-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: rgba(255,255,255,0.4);
            font-size: 15px;
        }
        .browser-home-state.hidden { display: none; }
        #split-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: calc(var(--split-left-width) - 10px);
            width: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 230;
            cursor: col-resize;
            touch-action: none;
            transition: background-color 0.25s ease;
        }
        #split-divider:hover,
        #player-shell.resizing-divider #split-divider {
            background-color: rgba(255, 255, 255, 0.06);
        }
        #player-shell.browser-split #split-divider {
            display: flex;
        }
        
        /* Swapped split divider physical position synchronization */
        #player-shell.swapped #split-divider {
            left: calc(100% - var(--split-left-width) - 10px);
        }

        /* Top Control Pill styled perfectly for divider center-floating */
        .split-control-pill {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(20, 20, 30, 0.92);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 3px 5px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 229, 255, 0.1);
            z-index: 10;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .split-control-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #00E5FF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 6px;
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .split-control-btn svg {
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .split-control-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            color: #fff;
            transform: scale(1.15);
        }
        .split-control-btn:active {
            transform: scale(0.92);
        }
        
        /* Specific rotation effect for swap button */
        .split-swap-top-btn:hover svg {
            transform: rotate(180deg);
        }

        /* Sidebar app-pair 40px icon layout */
        .split-app-item .app-pair-icon-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .split-app-item .app-pair-icon-left {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 26px;
            height: 26px;
            z-index: 2;
            border: 2px solid #14141e;
            border-radius: 6px;
        }
        .split-app-item .app-pair-icon-right {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 26px;
            height: 26px;
            z-index: 3;
            border: 2px solid #14141e;
            border-radius: 6px;
        }
        #split-divider::before {
            content: '';
            width: 4px;
            height: 72px;
            border-radius: 999px;
            background: rgba(255,255,255,0.35);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        #split-divider:hover::before,
        #player-shell.resizing-divider #split-divider::before {
            background: #00E5FF;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
            transform: scaleX(1.5);
        }
        #split-pane-toolbar {
            display: none;
            gap: 5px;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 999px;
            padding: 4px 6px;
            flex-shrink: 0;
        }
        .split-pane-btn {
            border: none;
            border-radius: 999px;
            padding: 6px 11px;
            background: rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.75);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .split-pane-btn:hover { background: rgba(255,255,255,0.20); color: #fff; }
        .split-pane-btn.active {
            background: rgba(255,255,255,0.25);
            color: #fff;
            font-weight: 600;
        }
        .split-pane-btn.stop-btn {
            background: rgba(255,255,255,0.10);
            color: rgba(255,120,120,0.9);
            margin-left: 2px;
        }
        .split-pane-btn.stop-btn:hover { background: rgba(255,80,80,0.4); color: #fff; }
        .split-toolbar-sep {
            width: 1px;
            height: 16px;
            background: rgba(255,255,255,0.15);
            margin: 0 1px;
        }

        /* ── App Pair Icons ── */
        .app-pair-icon-wrapper {
            position: relative;
            width: 72px;
            height: 72px;
            margin-bottom: 8px;
        }
        .app-pair-icon-left {
            width: 48px;
            height: 48px;
            position: absolute;
            left: 2px;
            bottom: 2px;
            z-index: 3;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background: #14141e;
            border: 3px solid #14141e; /* Elegant masking outline that cleanly cuts the under-layered icon */
        }
        .app-pair-icon-right {
            width: 48px;
            height: 48px;
            position: absolute;
            right: 2px;
            top: 2px;
            z-index: 2;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            background: #14141e;
        }
        .app-pair-icon-left, .app-pair-icon-right {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        .app-cell:hover .app-pair-icon-left {
            transform: translate(-3px, 3px) scale(1.02);
            box-shadow: -4px 6px 12px rgba(0,0,0,0.6);
        }
        .app-cell:hover .app-pair-icon-right {
            transform: translate(3px, -3px) scale(1.02);
            box-shadow: 4px -2px 10px rgba(0,0,0,0.5);
        }

        /* ── Drag & Drop Overlay (Spatial Launching) ── */
        #drag-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.65);
            backdrop-filter: blur(20px);
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            box-sizing: border-box;
        }

        #drag-overlay.active {
            opacity: 1;
            pointer-events: auto; /* Allow pointer capture while active */
        }

        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-sizing: border-box;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .drop-zone-icon {
            font-size: 32px;
            margin-bottom: 8px;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .drop-zone-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Hovered Drop Zone effects with harmonious HSL glow glows */
        #drop-zone-top.hovered {
            border: 2px solid #FFD700;
            color: #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.06);
            transform: scale(1.02);
        }
        #drop-zone-top.hovered .drop-zone-icon {
            transform: scale(1.25);
        }

        #drop-zone-autorun.hovered {
            border: 2px solid #00E5FF;
            color: #00E5FF;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
            background: rgba(0, 229, 255, 0.06);
            transform: scale(1.02);
        }
        #drop-zone-autorun.hovered .drop-zone-icon {
            transform: scale(1.25);
        }

        #drop-zone-launch-left.hovered {
            border: 2px solid #00E5FF;
            color: #00E5FF;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.35);
            background: rgba(0, 229, 255, 0.08);
            transform: scale(1.03);
        }
        #drop-zone-launch-left.hovered .drop-zone-icon {
            transform: scale(1.25);
        }

        #drop-zone-launch-right.hovered {
            border: 2px solid #E040FB;
            color: #E040FB;
            box-shadow: 0 0 40px rgba(224, 64, 251, 0.35);
            background: rgba(224, 64, 251, 0.08);
            transform: scale(1.03);
        }
        #drop-zone-launch-right.hovered .drop-zone-icon {
            transform: scale(1.25);
        }

        #drop-zone-bottom.hovered {
            border: 2px solid #FF3B30;
            color: #FF3B30;
            box-shadow: 0 0 30px rgba(255, 59, 48, 0.25);
            background: rgba(255, 59, 48, 0.08);
            transform: scale(1.02);
        }
        #drop-zone-bottom.hovered .drop-zone-icon {
            transform: scale(1.2);
        }

        /* Drop Zone Previews ( 반투명 기존 매핑 앱 정보 ) */
        .drop-zone-preview {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.35;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .drop-zone-preview img {
            width: 48px;
            height: 48px;
            margin-bottom: 6px;
            object-fit: contain;
        }
        .drop-zone-preview span {
            font-size: 11px;
            color: #ccc;
            font-weight: 500;
        }

        /* Dragged Floating Ghost */
        .drag-ghost {
            position: fixed;
            width: 72px;
            height: 72px;
            pointer-events: none;
            z-index: 600;
            opacity: 0.85;
            transform: translate(-50%, -50%) scale(1.1);
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
        }
        .drag-ghost img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* App Pair Edit Dialog */
        #app-pair-dialog-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 18, 0.7);
            backdrop-filter: blur(15px);
            z-index: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #app-pair-dialog-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #app-pair-dialog {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            width: 380px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #app-pair-dialog-overlay.active #app-pair-dialog {
            transform: scale(1);
        }
        .dialog-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #00E5FF;
            text-shadow: 0 0 10px rgba(0,229,255,0.3);
        }
        .pair-edit-container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 28px;
        }
        .pair-app-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
        }
        .pair-app-slot img {
            width: 64px;
            height: 64px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .pair-app-slot span {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            color: #eee;
        }
        .swap-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: rgba(255,255,255,0.8);
        }
        .swap-btn:hover {
            background: #00E5FF;
            color: #000;
            box-shadow: 0 0 12px rgba(0,229,255,0.5);
            transform: rotate(180deg);
        }
        .dialog-buttons {
            display: flex;
            gap: 12px;
            justify-content: stretch;
        }
        .dialog-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .dialog-btn.cancel {
            background: rgba(255,255,255,0.08);
            color: #eee;
        }
        .dialog-btn.cancel:hover {
            background: rgba(255,255,255,0.15);
        }
        .dialog-btn.dissolve {
            background: rgba(255, 59, 48, 0.15);
            color: #FF3B30;
            border: 1px solid rgba(255,59,48,0.3);
        }
        .dialog-btn.dissolve:hover {
            background: rgba(255, 59, 48, 0.25);
        }
        .dialog-btn.save {
            background: #00E5FF;
            color: #000;
            box-shadow: 0 0 10px rgba(0,229,255,0.3);
        }
        .dialog-btn.save:hover {
            background: #00b8cc;
        }
    </style>
</head>
<body>
    <div id="container">

        <div id="splash-screen">
            <img id="splash-logo" src="img/logo.svg" alt="Castla">
            <div id="splash-loading">
                <div class="splash-spinner"></div>
                <span class="splash-loading-text">Loading...</span>
            </div>
            <div id="splash-unmute">
                <span class="splash-tap-text">Tap to Start</span>
            </div>
        </div>

        <!-- Global Notice Toast Layer -->
        <div id="launcher-loading" style="display: none;">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading apps...</div>
        </div>

        <!-- Web Native Launcher UI -->
        <div id="web-launcher">
            <div id="launcher-content" style="display:none;"></div>
        </div>

        <!-- Split Drawer triggers & UI -->
        <div id="split-drawer">
            <div id="split-handle">
                <div class="handle-dots">
                    <div class="handle-dot"></div>
                    <div class="handle-dot"></div>
                    <div class="handle-dot"></div>
                </div>
            </div>
            <div class="split-drawer-header">
                <span>Launcher</span>
                <span class="close-drawer" onclick="document.getElementById('split-drawer').classList.remove('open')">&times;</span>
            </div>
            <div class="split-app-list" id="split-app-list"></div>
        </div>

        <div id="player-shell">
            <div id="stream-pane">
                <canvas id="display"></canvas>
                <video id="mse-video" muted autoplay playsinline></video>
            </div>
            <div id="split-divider" aria-hidden="true">
                <div class="split-control-pill">
                    <!-- Left Fullscreen -->
                    <button id="split-expand-left-btn" class="split-control-btn" title="Left Fullscreen">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="14 6 6 6 6 14"></polyline>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    <!-- Swap -->
                    <button id="split-swap-top-btn" class="split-control-btn split-swap-top-btn" title="Swap Screens">

                            <polyline points="17 5 21 8 17 11" />

                            <polyline points="10 6 18 6 18 14"></polyline>
                            <line x1="18" y1="6" x2="6" y2="18"></line>

            </div>
            <div id="browser-split-pane">
                <canvas id="display-secondary"></canvas>
                <div class="browser-pane-ui" id="browser-pane-ui">
                    <div class="browser-pane-toolbar">
                        <input id="browser-url-input" class="browser-url-input" type="url" placeholder="URL..." autocomplete="off" autocorrect="off" spellcheck="false">
                        <button id="browser-go-btn" class="browser-toolbar-btn go-btn">Go</button>

                    </div>
                    <div class="browser-presets" id="browser-presets"></div>
                    <div class="browser-iframe-wrap" id="browser-iframe-wrap">
                        <div class="browser-home-state" id="browser-home-state">
                            <span>Select a site or enter a URL</span>
                        </div>

                        <div class="browser-loading hidden" id="browser-loading">
                            <div class="loading-spinner"></div>
                        </div>

                            <span>This site cannot be embedded.</span>
                            <button class="browser-toolbar-btn" id="browser-error-close">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

                    <div class="split-toolbar-sep"></div>
                    <button id="split-swap-btn" class="split-pane-btn" style="background: rgba(255,255,255,0.08); margin-right: 4px;">좌우 전환</button>
                    <button id="split-close-btn" class="split-pane-btn stop-btn">종료</button>
                </div>

            </div> <!-- /#overlay-menu-panel -->
        </div> <!-- /#overlay-menu -->

        <!-- Auto Tier Toast -->
        <div id="auto-tier-toast"
             style="position:fixed;top:20px;left:50%;transform:translateX(-50%);
                    z-index:300;padding:10px 20px;border-radius:12px;
                    background:rgba(20,20,30,0.9);backdrop-filter:blur(10px);
                    color:rgba(255,255,255,0.9);font-size:14px;font-weight:500;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                    box-shadow:0 4px 16px rgba(0,0,0,0.4);
                    border:1px solid rgba(255,255,255,0.1);
                    opacity:0;pointer-events:none;
                    transition:opacity 0.3s ease;white-space:nowrap;">
        </div>

        <!-- Drag & Drop Overlay -->
        <div id="drag-overlay">
            <div class="drag-row-top" style="display: flex; gap: 16px; height: 110px; width: 100%; flex-shrink: 0;">
                <div id="drop-zone-top" class="drop-zone" style="flex: 1; height: 100%;">
                    <span class="drop-zone-icon" style="font-size: 24px; margin-bottom: 4px;">★</span>
                    <span class="drop-zone-text" style="font-size: 13px;">즐겨찾기 추가</span>
                </div>
                <div id="drop-zone-autorun" class="drop-zone" style="flex: 1; height: 100%;">
                    <span class="drop-zone-icon" style="font-size: 24px; margin-bottom: 4px;">⚡</span>
                    <span class="drop-zone-text" style="font-size: 13px;">자동실행 등록</span>
                    <div class="drop-zone-preview" id="drop-zone-autorun-preview"></div>
                </div>
            </div>
            <div class="drag-row-middle" style="display: flex; gap: 16px; flex: 1; width: 100%;">
                <div id="drop-zone-launch-left" class="drop-zone" style="flex: 1; height: 100%; border-color: rgba(0, 229, 255, 0.35); background: rgba(0, 229, 255, 0.02);">
                    <span class="drop-zone-icon" style="font-size: 40px; color: #00E5FF; margin-bottom: 12px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);">🖥️</span>
                    <span class="drop-zone-text" style="font-size: 16px; font-weight: 700; color: #00E5FF; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);">Primary(왼쪽)에 실행</span>
                    <span style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px;">VD_1 Screen fullscreen execution</span>
                </div>
                <div id="drop-zone-launch-right" class="drop-zone" style="flex: 1; height: 100%; border-color: rgba(224, 64, 251, 0.35); background: rgba(224, 64, 251, 0.02);">
                    <span class="drop-zone-icon" style="font-size: 40px; color: #E040FB; margin-bottom: 12px; text-shadow: 0 0 10px rgba(224, 64, 251, 0.4);">🖥️</span>
                    <span class="drop-zone-text" style="font-size: 16px; font-weight: 700; color: #E040FB; text-shadow: 0 0 10px rgba(224, 64, 251, 0.3);">Secondary(오른쪽)에 실행</span>
                    <span style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px;">VD_2 Independent & Split launch</span>
                </div>
            </div>
            <div class="drag-row-bottom" style="display: flex; width: 100%; height: 80px; flex-shrink: 0; display: none;" id="drag-row-bottom-wrap">
                <div id="drop-zone-bottom" class="drop-zone" style="width: 100%; height: 100%; border-color: rgba(255, 59, 48, 0.3);">
                    <span class="drop-zone-icon" style="font-size: 22px; margin-bottom: 4px;">🗑️</span>
                    <span class="drop-zone-text" style="font-size: 13px; color: #FF3B30;">제거 / 휴지통</span>
                </div>
            </div>
        </div>

        <!-- App Pair Edit Dialog Overlay -->
        <div id="app-pair-dialog-overlay">
            <div id="app-pair-dialog">
                <div class="dialog-title">App Pair Edit</div>
                <div class="pair-edit-container">
                    <div class="pair-app-slot" id="pair-app-left">
                        <img src="" alt="" />
                        <span>Left App</span>
                    </div>
                    <div class="swap-btn" id="pair-swap-btn" title="Swap sides">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/>
                        </svg>
                    </div>
                    <div class="pair-app-slot" id="pair-app-right">
                        <img src="" alt="" />
                        <span>Right App</span>
                    </div>
                </div>
                <div class="dialog-buttons">
                    <button class="dialog-btn cancel" id="pair-dialog-cancel">Cancel</button>
                    <button class="dialog-btn dissolve" id="pair-dialog-dissolve">Dissolve Pair</button>
                    <button class="dialog-btn save" id="pair-dialog-save">Save & Close</button>
                </div>
            </div>
        </div>

    <script src="js/decoder.js"></script>
    <script src="js/mse-decoder.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/frame-pacer.js"></script>
    <script src="js/touch.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/fallback.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
